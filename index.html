<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Maintix</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>Maintix</h1>

    <p class="subtitle">
      Fehlerdatenbank für Laserschweißanlagen
    </p>



    <!-- ADMIN LOGIN -->

    <div class="card">

      <h2>Admin Login</h2>

      <input
        type="text"
        id="adminUser"
        placeholder="Benutzername"
      >

      <input
        type="password"
        id="adminPass"
        placeholder="Passwort"
      >

      <button id="loginBtn">
        Login
      </button>

      <button id="showAllBtn">
        Alle Fehler anzeigen
      </button>

      <p id="loginStatus"></p>

    </div>



    <!-- FEHLERSUCHE -->

    <div class="card">

      <h2>Fehler suchen</h2>

      <input
        type="text"
        id="errorInput"
        placeholder="Suchbegriff eingeben..."
      >

      <button id="searchBtn">
        Fehler suchen
      </button>

    </div>



    <!-- FEHLER ANLEGEN -->

    <div class="card">

      <h2>Neuen Fehler anlegen</h2>



      <!-- ANLAGEN AUSWAHL -->

      <select id="newPlant">

        <option value="">
          Anlage auswählen
        </option>

        <option>Allgemein</option>
        <option>LS002</option>
        <option>LS003</option>
        <option>LS004</option>
        <option>LS005</option>
        <option>LS006</option>
        <option>LS007</option>
        <option>LS008</option>
        <option>LS009</option>
        <option>Linie 4</option>
        <option>Linie 7</option>

      </select>



      <input
        type="text"
        id="newCode"
        placeholder="Fehlercode"
      >

      <input
        type="text"
        id="newTitle"
        placeholder="Fehlertitel"
      >

      <textarea
        id="newSolution"
        placeholder="Lösung"
      ></textarea>

      <button id="createBtn">
        Fehler anlegen
      </button>

    </div>



    <!-- ANLAGEN BUTTONS -->

    <div class="card">

      <h2>Anlagen</h2>

      <div class="plant-grid">

        <button class="plant-btn">Allgemein</button>
        <button class="plant-btn">LS002</button>
        <button class="plant-btn">LS003</button>
        <button class="plant-btn">LS004</button>
        <button class="plant-btn">LS005</button>
        <button class="plant-btn">LS006</button>
        <button class="plant-btn">LS007</button>
        <button class="plant-btn">LS008</button>
        <button class="plant-btn">LS009</button>
        <button class="plant-btn">Linie 4</button>
        <button class="plant-btn">Linie 7</button>

      </div>

    </div>



    <!-- ERGEBNIS -->

    <div id="result"></div>

  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="app.js"></script>

</body>
</html>
