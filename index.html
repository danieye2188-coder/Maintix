<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Maintix</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>Maintix</h1>

    <p class="subtitle">
      Fehlerdatenbank für Laserschweißanlagen
    </p>



    <!-- ANLAGEN AUSWAHL -->

    <div class="card">

      <h2>Anlage auswählen</h2>

      <select id="plantSelect">

        <option>Allgemein</option>
        <option>LS002</option>
        <option>LS003</option>
        <option>LS004</option>
        <option>LS005</option>
        <option>LS006</option>
        <option>LS007</option>
        <option>LS008</option>
        <option>LS009</option>
        <option>Linie 4</option>
        <option>Linie 7</option>

      </select>

      <button id="loadPlantBtn">
        Fehler der Anlage anzeigen
      </button>

    </div>



    <!-- FEHLER SUCHE -->

    <div class="card">

      <h2>Fehler suchen</h2>

      <input
        type="text"
        id="errorInput"
        placeholder="Suchbegriff eingeben..."
      >

      <button id="searchBtn">
        Fehler suchen
      </button>

    </div>



    <!-- FEHLER ANLEGEN -->

    <div class="card">

      <h2>Neuen Fehler anlegen</h2>

      <select id="newPlant">

        <option>Allgemein</option>
        <option>LS002</option>
        <option>LS003</option>
        <option>LS004</option>
        <option>LS005</option>
        <option>LS006</option>
        <option>LS007</option>
        <option>LS008</option>
        <option>LS009</option>
        <option>Linie 4</option>
        <option>Linie 7</option>

      </select>

      <input
        type="text"
        id="newCode"
        placeholder="Fehlercode"
      >

      <input
        type="text"
        id="newTitle"
        placeholder="Fehlertitel"
      >

      <textarea
        id="newSolution"
        placeholder="Lösung"
      ></textarea>

      <button id="createBtn">
        Fehler anlegen
      </button>

    </div>



    <!-- ERGEBNISSE -->

    <div id="result"></div>



  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="app.js"></script>

</body>
</html>
